name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet Packages
      run: |
        cd windows-port
        nuget restore PKGMachete.sln

    - name: Build Solution
      run: |
        cd windows-port
        msbuild PKGMachete.sln /p:Configuration=Release /p:Platform=x64

    - name: Upload EXE to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v5.0.0
        files: windows-port/x64/Release/PKGMachete.exe
