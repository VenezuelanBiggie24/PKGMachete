name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.3'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Configure CMake
      run: |
        cd linux-port
        mkdir build
        cd build
        cmake ..

    - name: Build
      run: |
        cd linux-port/build
        cmake --build . --config Release

    - name: Run windeployqt
      run: |
        cd linux-port/build/Release
        windeployqt PKGMachete.exe

    - name: Zip EXE bundle
      run: |
        cd linux-port/build/Release
        Compress-Archive -Path * -DestinationPath ../../../PKGMachete-Windows.zip

    - name: Upload Windows Bundle to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v5.0.0
        files: PKGMachete-Windows.zip
